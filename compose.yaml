# Two containers sharing one volume: the builder writes pages into it, Caddy
# serves them. They never talk to each other — the directory tree is the whole
# interface, and Caddy's config is static, so nothing needs reloading.
#
# Both run unprivileged on 8080/8443; the host publishes the real ports.
#
# RustFS stands in for S3 locally, so `make run` and the end-to-end test
# exercise the real certificate-storage path rather than a stub. In production
# point S3_ENDPOINT at the actual store, or leave it empty for AWS.

services:
  builder:
    build:
      context: ./builder
      target: builder
    restart: unless-stopped
    environment:
      DOMAINS_URL: ${DOMAINS_URL:-file:///domains/domains.json}
      REBUILD_INTERVAL: ${REBUILD_INTERVAL:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Credentials for s3:// domain lists. Set AWS_ENDPOINT_URL for any
      # S3-compatible store.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
    volumes:
      - sites:/srv/sites
      # Only needed for the file:// default above.
      - ./domains.example.json:/domains/domains.json:ro

  # Creates the certificate bucket in RustFS, then exits. Development only:
  # a real deployment provisions its bucket out of band. The end-to-end test
  # also runs it to look inside the bucket.
  bucket-init:
    build:
      context: ./builder
      target: s3dev
    depends_on:
      - rustfs
    command: ["ensure-bucket"]
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:-caddy-certs}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    ports:
      - "${HTTP_BIND:-8080}:8080"
      - "${HTTPS_BIND:-8443}:8443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      CACHE_MAX_AGE: ${CACHE_MAX_AGE:-300}
      # Empty means the real ACME issuer. Defaults that way on purpose: the
      # failure mode is "local HTTPS needs DNS", not "production quietly
      # serves untrusted certificates". `make test-e2e` sets it to internal.
      CADDY_TLS_ISSUER: ${CADDY_TLS_ISSUER:-}
      # Empty disables the helpcenter redirect. Caddy reads both from its
      # environment, so a change needs a new container (`up -d`), not a reload.
      HELPCENTER_REDIRECT_HOSTS: ${HELPCENTER_REDIRECT_HOSTS:-}
      HELPCENTER_REDIRECT_TARGET: ${HELPCENTER_REDIRECT_TARGET:-}
      # The addresses the parked hosts' DNS must point at, space-separated.
      # No certificate is ordered for a host with any record elsewhere. Empty
      # skips the check: set it in production.
      PUBLIC_IPS: ${PUBLIC_IPS:-}
      # Certificate storage. Empty S3_ENDPOINT means real AWS.
      S3_BUCKET: ${S3_BUCKET:-caddy-certs}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_PREFIX: ${S3_PREFIX:-caddy}
      S3_ENCRYPTION_KEY: ${S3_ENCRYPTION_KEY:-}
    volumes:
      - sites:/srv/sites:ro
    # The network-facing container gets nothing it does not use: no writable
    # root, no capabilities (it listens on unprivileged ports as nonroot).
    # /data only holds Caddy's instance ID.
    read_only: true
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  # S3-compatible store, for local development and the end-to-end test only.
  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    ports:
      - "${S3_BIND:-9000}:9000"
    volumes:
      - rustfs-data:/data

volumes:
  sites:
  rustfs-data:
